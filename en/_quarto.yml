project:
  type: website
  output-dir: ../docs/en

website:
  title: "Mista | Research Notes"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: daily-reports.qmd
        text: Daily Reports
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/your-username

format:
  html:
    theme: litera
    toc: true
    code-copy: true
    code-overflow: wrap
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Serif:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    css: ../styles.scss

execute:
  echo: true
  warning: false
  message: false
